plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def appVersionName = "1.9.2"

android {

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            release_no_compression {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    compileSdk = 37
    compileSdkMinor = 2
    buildToolsVersion '37.0.0'
    namespace = 'org.vovka.birthdaycountdown'

    defaultConfig {
        //https://developer.android.com/studio/releases/emulator
        buildToolsVersion  = "37.0.0" //https://developer.android.com/tools/releases/build-tools

        def locales = ['en', 'de', 'ru', 'es', 'uk', 'pt', 'fr', 'be', 'pl', 'cs']
        buildConfigField "String[]", "TRANSLATIONS", "new String[]{\""+locales.join("\",\"")+"\"}"
        resourceConfigurations += locales
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        dataBinding = false
        viewBinding = false
        buildConfig = true
    }

    packagingOptions {
        jniLibs {
            excludes += ['**/kotlin/**']
        }
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', '/META-INF/*.kotlin_module', '**/kotlin/**', '**/*.txt', '**/*.xml', '**/*.properties']
        }
    }


    //https://stackoverflow.com/questions/21405457/autoincrement-versioncode-with-gradle-extra-properties
    def versionPropsFile = rootProject.file('version.properties')
    if (versionPropsFile.canRead()) {
        Properties versionProps = new Properties()

        versionProps.load(new FileInputStream(versionPropsFile))

        def code = versionProps['VERSION_CODE'].toInteger() + 1

        versionProps['VERSION_CODE'] = code.toString()
        versionProps.store(versionPropsFile.newWriter(), null)

        defaultConfig {
            applicationId "org.vovka.birthdaycountdown"
            //https://stackoverflow.com/questions/24441178/recommended-minimum-android-app-sdk
            minSdkVersion 21 // 21 - minimum for themes and ?android:attr support
            //minSdkVersion (lowest possible) <= targetSdkVersion == compileSdkVersion (latest SDK)
            targetSdkVersion 37 //https://developer.android.com/reference/android/os/Build.VERSION_CODES.html
            versionCode code
            versionName appVersionName
            vectorDrawables.useSupportLibrary = true //https://stackoverflow.com/questions/41407811/android-vectordrawables-usesupportlibrary-true-is-stopping-app
        }
    } else {
        throw new FileNotFoundException("Could not read version.properties!")
    }
    buildTypes {
        release {
            //https://stackoverflow.com/questions/3540739/how-to-programmatically-read-the-date-when-my-android-apk-was-built
            buildConfigField "String", "BUILD_TIME", "\"" + System.currentTimeMillis() + "\""

            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            //https://habr.com/ru/post/415499/
            //https://www.guardsquare.com/en/products/proguard/manual/retrace
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release_no_compression {
            //https://stackoverflow.com/questions/3540739/how-to-programmatically-read-the-date-when-my-android-apk-was-built
            buildConfigField "String", "BUILD_TIME", "\"" + System.currentTimeMillis() + "\""

            debuggable = false
            minifyEnabled = false
            //noinspection NotShrinkingResources
            shrinkResources = false
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            buildConfigField "String", "BUILD_TIME", "\"" + System.currentTimeMillis() + "\""

            minifyEnabled = false
            //noinspection NotShrinkingResources
            shrinkResources = false
            debuggable = true
            jniDebuggable = true
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def apkName = "Birthdays&Events_${appVersionName}.apk"
            output.outputFileName.set(apkName)
        }
    }
}

dependencies {
    //noinspection GradleDependency 1.8.0 - API23+
    implementation 'androidx.appcompat:appcompat:1.7.1' //https://developer.android.com/jetpack/androidx/releases/appcompat
    //noinspection GradleDependency 1.14.0-alpha09 - API23+
    implementation 'com.google.android.material:material:1.14.0-alpha08' //https://github.com/material-components/material-components-android/releases
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0' //https://developer.android.com/jetpack/androidx/releases/swiperefreshlayout
    implementation 'androidx.recyclerview:recyclerview:1.4.0' //https://developer.android.com/jetpack/androidx/releases/recyclerview
    //noinspection GradleDependency 1.18 - API23+
    implementation 'androidx.core:core:1.17.0' //https://developer.android.com/jetpack/androidx/releases/core
    implementation 'androidx.core:core-splashscreen:1.2.0' //https://developer.android.com/jetpack/androidx/releases/core#core-splashscreen-1.2.0
    //noinspection GradleDependency 1.9.0 - API23+
    implementation 'androidx.fragment:fragment:1.8.9' //https://developer.android.com/jetpack/androidx/releases/fragment
    //noinspection GradleDependency 1.12 - API23+
    implementation 'androidx.activity:activity:1.11.0' //https://developer.android.com/jetpack/androidx/releases/activity
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}